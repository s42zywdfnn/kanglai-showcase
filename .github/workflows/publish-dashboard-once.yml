name: Publish dashboard and film files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the approved static files
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib, re
          base = 'https://kanglai-dashboard-v3-v4-1011.mystic-dune-4929.chatgpt.site/'
          files = {
              'app.js': '096de14f3fda4164be9fce55c034043e4cccb7a54fde6e92157c56ffb10a4ae4',
              'assets/brand-film-poster.png': '6a4bd0e3b6c2177944252af0f9443077d2b73470a6aa863c16fabbb73b5741a5',
              'assets/brand-icon.jpg': '9613f0e41d5596c8fb1b7791ce6ccbae6b769d25ff6e3ddcb302573602500444',
              'assets/china-provinces.json': '99adfeded5223848bbe37a0a12f8023e11ee12161c7800521c27db42fdeac275',
              'assets/consult.jpg': 'ee8f7f74dad4a5b1e7947eb0b2db5b0a6c839da678b67c0543b603bda45bae81',
              'assets/food-checkin.jpg': '6bb505dc1358303b99b2f0180a6f04eebeddc81337e1d4f8e8cd3d8789ef7d21',
              'assets/intake-report.jpg': '6a18460cf047b5a6e50531fd0487e7d293aeb0b24a794fc296d701cffd539caf',
              'assets/intake-self-check.jpg': '7ec8999106b5258483b6dbac2ecee102a2c409df74c4a4b073d58e262f01955b',
              'assets/intake-tongue.jpg': '807d7a41cbb28363b6ea9d90e78ab3f0444f24767455877a7cdd3a3003487572',
              'data/dashboard.json': '8a69837e8331396f9653b5aa329cc9358530a9e6808ddd49770824757d5caab2',
              'data-adapter.js': '9d5a39b50c327902c7c791ed83f1ef3ed70ef7b64537fe5c78028b9d92c5dba5',
              'demo-playback.js': 'c9f50e1e3cdc688cbffb7127b2f11e609fa693da36e786bc70c212375f86b2ce',
              'event-model.js': '669ac51232cbcdab37eb2fa247073e9e3097a06c8c0473ce5788ae4d601f3a76',
              'film/index.html': '177a975218b140c3bfd428f2866acb5319248745f4c3ad51d9be1b5b0f9b3438',
              'film/media/brand-film.mp4': 'fc1f5cb77bd7dfb89fa91f74f5ff7e03f73edde772ba63e9d6586025681ba40c',
              'film/poster.png': '6a4bd0e3b6c2177944252af0f9443077d2b73470a6aa863c16fabbb73b5741a5',
              'film/vendor/hls-LICENSE.txt': 'ca8773cf798c7ed997d4dd7c8e23c348699f8d5b7462636694cc14de6cda12db',
              'film/vendor/hls.min.js': '7c47cd97d7a6e7b98d9623dd8ed9a6d45af4be4085e0c2001cd7175c2b4cfb07',
              'index.html': '8231220b3bc53447a637368ae6617dccb2dad39fd4c98d0a780739ee0c91dc95',
              'motion-model.js': '7532df26450c94889e52f8b399d060236610f1c2434920a97604d6aa0879bdcf',
              'operations-model.js': 'fbabf92cc93e2f22955edc88a65af21e73d36054b9c6d36f1978f2bf79e32b6b',
              'style.css': '60eddd0499695542988e5054dd48aefb1040c64c1ed64bc3d553480e2f5ca787',
          }
          for rel, expected in files.items():
              with urlopen(Request(base + rel, headers={'User-Agent':'curl/8.0'}), timeout=90) as response:
                  data = response.read()
              if rel.endswith('.html'):
                  data = re.sub(rb'<script>\(function\(\)\{function c\(\).*?</script>(?=</body>)', b'', data, flags=re.S)
              actual = hashlib.sha256(data).hexdigest()
              if actual != expected:
                  raise SystemExit(f'Checksum mismatch: {rel}')
              path = Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)
              print(f'Verified {rel}')
          PYCODE
      - name: Commit static files to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js assets/brand-film-poster.png assets/brand-icon.jpg assets/china-provinces.json assets/consult.jpg assets/food-checkin.jpg assets/intake-report.jpg assets/intake-self-check.jpg assets/intake-tongue.jpg data/dashboard.json data-adapter.js demo-playback.js event-model.js film/index.html film/media/brand-film.mp4 film/poster.png film/vendor/hls-LICENSE.txt film/vendor/hls.min.js index.html motion-model.js operations-model.js style.css
          if ! git diff --cached --quiet; then
            git commit -m 'Publish dashboard and film directly on GitHub Pages'
            git push origin HEAD:main
          fi
